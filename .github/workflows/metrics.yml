name: Native KV load campaign
on:
  workflow_dispatch:
    inputs:
      pilot:
        type: boolean
        default: true
        description: Short native calibration before full campaigns
permissions:
  contents: read
jobs:
  load:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        bytes: ${{ fromJSON(inputs.pilot && '[64]' || '[64,1024,16384]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.3
          cache: false
      - run: rustup toolchain install 1.99.1 --profile minimal && rustup default 1.99.1
      - run: cargo test --locked -p monoio-kv-server && cargo build --locked --release -p monoio-kv-server
      - run: go run kv-server/scripts/load.go -self-test && go build -o /tmp/kv-load kv-server/scripts/load.go
      - run: python3 kv-server/scripts/verify.py --binary target/release/monoio-kv-server --evidence reports/evidence/correctness
      - name: Frozen scheduled-arrival load
        run: python3 kv-server/scripts/campaign.py --binary target/release/monoio-kv-server --client /tmp/kv-load --bytes ${{ matrix.bytes }} --output reports/evidence/campaign ${{ inputs.pilot && '--pilot' || '' }}
      - name: Separate syscall profile
        if: always()
        run: |
          sudo apt-get update
          sudo apt-get install --yes strace
          python3 kv-server/scripts/campaign.py --binary target/release/monoio-kv-server --client /tmp/kv-load --bytes ${{ matrix.bytes }} --output reports/evidence/profile --profile
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: kv-load-${{ matrix.bytes }}-${{ github.sha }}
          path: reports/evidence/
          if-no-files-found: error
